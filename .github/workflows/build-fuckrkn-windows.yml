name: Build FuckRKN Windows

on:
  workflow_dispatch:
  push:
    branches:
      - codex/fuckrkn-native-build

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      VERSION: 1.1.0
      BUILD_VERSION: 1.1.0
      PUBLIC_BUILD_VERSION: 1.1.0
      BUILD_CHANNEL: stable
      RELEASE_CHANNEL: stable
      PUBLIC_RELEASE_CHANNEL: stable
      PLATFORM: windows
      DESKTOP_PLATFORM: windows
      ARCH: x64
      DESKTOP_ARCH: x64
      ELECTRON_ARCH: x64
      DESKTOP_VARIANT: default
      FLUXER_DESKTOP_BUILD_VARIANT: default
      FLUXER_WINDOWS_GAME_CAPTURE_MODULE_ENABLED: "false"

    steps:
      - name: Checkout build configuration
        uses: actions/checkout@v4
        with:
          path: config

      - name: Checkout Fluxer source
        uses: actions/checkout@v4
        with:
          repository: fluxerapp/fluxer
          ref: c8325bc3fce891f756a938872a76e358f51d118b
          path: source
          persist-credentials: false

      - name: Checkout Fluxer CI helpers
        uses: actions/checkout@v4
        with:
          repository: fluxerapp/fluxer
          ref: c8325bc3fce891f756a938872a76e358f51d118b
          path: _ci
          persist-credentials: false

      - name: Apply FuckRKN patches
        shell: pwsh
        run: |
          git -C source apply "$env:GITHUB_WORKSPACE\config\fuckrkn.patch"
          git -C _ci apply "$env:GITHUB_WORKSPACE\config\fuckrkn.patch"

      - name: Set up Rust for CI helpers
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.93.0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Ensure python3 command
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step ensure_python3_windows

      - name: Shorten Windows paths
        env:
          SUBST_TARGET: ${{ github.workspace }}/source
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step windows_paths

      - name: Normalize Windows workdir
        shell: pwsh
        run: |
          "WORKDIR=W:/" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step setup_pnpm_corepack

      - name: Set up MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@79dac248aac9d0059f86eae9d8b5bfab4e95e97c
        with:
          arch: amd64

      - name: Install Rust Windows targets
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step install_rust_windows_targets

      - name: Install dependencies
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step install_dependencies

      - name: Set package version
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step update_version

      - name: Set build channel
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step set_build_channel

      - name: Build Electron and native modules
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step build_electron_main

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Velopack CLI
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step install_velopack_cli

      - name: Package Windows application
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        env:
          TEMP: C:\t
          TMP: C:\t
          ELECTRON_BUILDER_CACHE: C:\ebcache
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step build_app_windows

      - name: Build installer
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step package_app_windows_velopack

      - name: Build portable ZIP
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step create_portable_zip_windows

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: FuckRKN-1.1.0-windows-x64
          path: |
            ${{ env.WORKDIR }}/fluxer_desktop/dist-electron/velopack-windows-x64/*.exe
            ${{ env.WORKDIR }}/fluxer_desktop/dist-electron/velopack-windows-x64/*-full.nupkg
            ${{ env.WORKDIR }}/fluxer_desktop/dist-electron/velopack-windows-x64/RELEASES
            ${{ env.WORKDIR }}/fluxer_desktop/dist-electron/velopack-windows-x64/releases.win.json
            ${{ env.WORKDIR }}/fluxer_desktop/dist-electron/*-portable-win-x64.zip
          if-no-files-found: error
          retention-days: 7
